# MCUboot CAN bootloader 升级片段 (angle-handler / io-edge-hub 共用)。
# 注意: mcuboot_EXTRA_CONF_FILE 会顶替 sysbuild 自动注入的
# <app>/sysbuild/mcuboot.conf (BOOT_MAX_IMG_SECTORS 等), 注入时两个
# 片段必须一起列出 (完整命令见各应用 README):
#   west build -b <board> applications/<app> --sysbuild \
#     "-Dmcuboot_EXTRA_CONF_FILE=$PWD/applications/<app>/sysbuild/mcuboot.conf;$PWD/libs/can_fw_upgrade/mcuboot_can.conf"
# can1 使能在板 DTS (apps/boards/<board>), bootloader 独立编译不含应用 overlay。
CONFIG_CAN=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_CAN_FW_UPGRADE=y
CONFIG_BOOT_GO_HOOKS=y
