# The west manifest file for Zephyr project.
#

manifest:
  defaults:
    remote: zephyr

  remotes:
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      revision: v4.4.2
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - littlefs
          - mbedtls
          - mcuboot
          - tf-psa-crypto
          - zcbor

  self:
    path: apps
    west-commands: scripts/west-commands.yml
