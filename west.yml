# The west manifest file for Zephyr project.
#

manifest:
  defaults:
    remote: kabirz

  remotes:
    - name: zephyr_site
      url-base: https://github.com/zephyrproject-rtos
    - name: kabirz
      url-base: https://github.com/kabirz

  projects:
    - name: zephyr
      revision: a05e4ff3f834d7ea149d191d4165b501659d7063
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - littlefs
          - mbedtls
          - mcuboot
          - tf-psa-crypto

    - name: canopen
      repo-path: canopen-zephyr
      revision: 880165413ffae5724df6fd67b08ff8e8b8d40bd7
      path: modules/canopen-zephyr
      submodules:
        - path: CANopenNode

  self:
    path: apps
    west-commands: scripts/west-commands.yml
