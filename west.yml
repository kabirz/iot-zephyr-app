# The west manifest file for Zephyr project.
#

manifest:
  defaults:
    remote: kabirz

  remotes:
    - name: zephyr_site
      url-base: https://github.com/zephyrproject-rtos
    - name: kabirz
      url-base: https://github.com/kabirz

  projects:
    - name: zephyr
      revision: v4.4.0-dtcm
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - littlefs
          - mbedtls
          - mcuboot
          - tf-psa-crypto

    - name: canopen
      revision: main
      path: modules/canopen-zephyr
      submodules:
        - path: CANopenNode

  self:
    path: apps
    west-commands: scripts/west-commands.yml
