# The west manifest file for Zephyr project.
#

manifest:
  defaults:
    remote: kabirz

  remotes:
    - name: zephyr_site
      url-base: https://github.com/zephyrproject-rtos
    - name: kabirz
      url-base: https://github.com/kabirz

  projects:
    - name: zephyr
      revision: app-main
      path: zephyr
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - littlefs
          - mbedtls
          - mcuboot
          - tf-psa-crypto
          - zcbor

  self:
    path: apps
    west-commands: scripts/west-commands.yml
