# lvgl + display 栈: LVGL 9 (Zephyr port) -> display_ili9341 ->
# mipi_dbi_stm32_fmc (8080 16 位) -> FMC NE1 (板 DTS lcd_bank)
CONFIG_DISPLAY=y
CONFIG_ILI9341=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_DOUBLE_VDB=y

# 电阻触摸 XPT2046 (bitbang SPI) + LVGL 指针 (zephyr,touch chosen)
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_LV_Z_SHELL=y
