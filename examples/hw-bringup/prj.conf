CONFIG_LOG=y
CONFIG_SHELL=y

CONFIG_I2C=y

# 24C02 EEPROM
CONFIG_EEPROM=y

# QSPI W25Q256
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y

# FMC SDRAM W9825G6KH
CONFIG_MEMC=y

# ADC(PA5) / DAC(PA4) / PWM(PA3)
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_PWM=y

# FDCAN1 回环自检
CONFIG_CAN=y

# RTC (LSE)
CONFIG_RTC=y

# TF 卡 (SDMMC1)
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
