# USB device_next (USBD) stack with the CDC ACM class.
# The controller advertises high-speed support at the driver level, but
# the USBHS0 embedded PHY enumerates at full speed at runtime, so only a
# full-speed configuration is registered.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# serial number from the chip unique ID
CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

CONFIG_MAIN_STACK_SIZE=2048
