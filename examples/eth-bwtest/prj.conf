CONFIG_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y

# 静态 IPv4: 网线直连开发机 enp3s0 (192.168.12.100/24)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.12.200"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""

CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y

# 网络栈缓冲: 1536 字节/包, 供百兆线速收发 (默认 128B 分片会把 TCP 拖死)。
# H743 AXI SRAM 512KB, 池子按 120x2 个整帧估算 (~360KB), 实测占用 ~420KB。
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=120
CONFIG_NET_BUF_TX_COUNT=120
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32

CONFIG_ENTROPY_GENERATOR=y

# PHY 驱动 (apps/drivers/yt8512)
CONFIG_PHY_MOTORCOMM_YT8512=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
# TX 异步模式实测会卡死带负载的发送 (echo/UDP 全挂, 小包 ACK 正常), 不开
CONFIG_ETH_STM32_HAL_RX_THREAD_STACK_SIZE=2048

# main.c 用 net_mgmt 事件等网络就绪
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# zperf (iperf2 兼容) 带宽测试: shell 里 zperf tcp/udp upload/download,
# 与主机 iperf2 联测 (iperf3 协议不兼容 zperf, 见 README)
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1472
CONFIG_NET_ZPERF_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y
# zperf 的 TCP+UDP 接收服务需要 4+1 个 poll 表项 (默认 3 会让 socket
# service 线程启动失败, zperf server 报 "Cannot register socket service")
CONFIG_ZVFS_POLL_MAX=10

CONFIG_SHELL=y
