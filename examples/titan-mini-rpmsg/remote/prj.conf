# CM33 副核: 调试控制台走 uart2 (H1 排针, CM85 侧已让出), IPC echo
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y

# CM33 shell (跑在 uart2 上, 与 CM85 的 uart1 互不相干)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
CONFIG_MBOX=y
CONFIG_LOG=n
