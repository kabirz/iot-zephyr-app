CONFIG_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y

# static IPv4 setup for the direct cable to the development machine
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.12.200"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""

CONFIG_NET_SHELL=y

CONFIG_NET_STATISTICS=y

# network stack buffers: the 128-byte default data chunks let only ~3 TCP
# segments be in flight (RX pool = 36 bufs), which stalls any transfer
# larger than ~4 KB
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32

CONFIG_ENTROPY_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_ETH_GD32_RX_THREAD_PRIO=4

# bring-up diagnosis: runtime DMA interrupt control over the shell
CONFIG_ETH_GD32_IRQ_TEST=y
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=16384
CONFIG_ETH_GD32_RX_DESC_NUM=32
CONFIG_CACHE_MANAGEMENT=y
