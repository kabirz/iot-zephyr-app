# UART shell (zephyr,shell-uart = uart1, U18: TXD1=P707 RXD1=P706)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# 日志 (经 shell log backend 输出到同一个串口)
CONFIG_LOG=y

# sys_reboot() 支持 (shell: kernel reboot)
CONFIG_REBOOT=y

# SD 卡 (SDHI0) + FATFS
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STACK=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
# sd_test() 局部 FATFS 结构体约 550B, 默认 1KB 主栈不够
CONFIG_MAIN_STACK_SIZE=2048

# QSPI NOR Flash (W25Q64): 板级 dts 中 ospi0 默认 disabled, 等驱动适配后打开
CONFIG_FLASH=y
