# 显示 + LVGL (GLCDC 1024x600 RGB565, 帧缓冲在 SDRAM)
CONFIG_DISPLAY=y
# SDRAM 控制器 (帧缓冲在 SDRAM, 不开则 GLCDC 读死内存 -> 黑屏)
CONFIG_MEMC=y
# TEMP-DEBUG: 单缓冲禁用交换, 排查黑屏
CONFIG_RENESAS_RA_GLCDC_FB_NUM=1
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# 触摸 GT911 (IIC0) + LVGL 指针输入
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
# 静音 I2C 错误刷屏 (触摸芯片可能拉住总线)
CONFIG_I2C_LOG_LEVEL_OFF=y
CONFIG_LV_Z_POINTER_INPUT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_SHELL=y
