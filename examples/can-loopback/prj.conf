CONFIG_CAN=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Shell for manual testing against the Linux can0 (SocketCAN) side
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
# 64-byte CAN-FD frames need 69 shell arguments (can send -f -b dev id b0..b63)
CONFIG_SHELL_ARGC_MAX=80
CONFIG_CAN_SHELL=y
CONFIG_REBOOT=y
