CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# shell
CONFIG_SHELL=y
CONFIG_FLASH_MAP_SHELL=y
CONFIG_FLASH_SHELL=y

CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_LOG=y
# 增大缓冲 + 缓冲满时阻塞而非丢弃 (调试高频 log 不丢)
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BLOCK_IN_THREAD=y

# 软件栈溢出检测 (Cortex-M3 无 SPLIM, 板级未开 ARM_MPU, 故 HW_STACK_PROTECTION
# 无效; STACK_SENTINEL 在线程栈底埋 magic, 上下文切换/中断退出时检查,
# 踩踏 → K_ERR_STACK_CHK_FAIL fatal)
CONFIG_STACK_SENTINEL=y

# can
CONFIG_CAN=y
CONFIG_CAN_SHELL=y
CONFIG_CAN_FW_UPGRADE=y

# spi + nRF24L01+ 2.4G 无线
CONFIG_SPI=y
CONFIG_NRF24L01P=y

# nRF24 链路层 XXTEA-CTR 加密 (用 rf24 地址作密钥; 须与 n2e-gw 同时开关)
CONFIG_NRF24L01P_CRYPT=n

# adc
CONFIG_ADC=y

# img
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# reboot
CONFIG_REBOOT=y

# i2c
CONFIG_I2C=y

#CRC
CONFIG_CRC=y

# hwinfo: 读 STM32 96-bit UID 派生 5B nRF24 地址 (HWINFO_STM32 默认随 SOC 自动启用)
CONFIG_HWINFO=y

# display
CONFIG_DISPLAY=y
# CONFIG_CHARACTER_FRAMEBUFFER=y

# Settings persistent storage (FCB backend)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# PM
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_DEVICE_SHELL=y
# 自定义 PM policy: sleeping 时无视任何定时器强制进 STOP, 保证真正进入低功耗
CONFIG_PM_POLICY_CUSTOM=y

# Display layout
CONFIG_ANGLE_HANDLER_ROW0_ASCII=y
CONFIG_ANGLE_HANDLER_SCANNER_8X16=y
# CONFIG_ANGLE_HANDLER_SHOW_XYZ is not set
