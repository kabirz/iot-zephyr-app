CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BLOCK_IN_THREAD=y

# 软件栈溢出检测 (Cortex-M3 无 SPLIM, 板级未开 ARM_MPU, 故 HW_STACK_PROTECTION
# 无效; STACK_SENTINEL 在线程栈底埋 magic, 上下文切换/中断退出时检查,
# 踩踏 → K_ERR_STACK_CHK_FAIL → 点亮 PA2 错误灯)
CONFIG_STACK_SENTINEL=y

# SPI + nRF24L01P
CONFIG_SPI=y
CONFIG_NRF24L01P=y

# nRF24 链路层 XXTEA-CTR 加密 (用 rf24 地址作密钥; 须与 angle-handler 同时开关)
CONFIG_NRF24L01P_CRYPT=n

# SPI Flash (MCUBoot)
CONFIG_FLASH=y
CONFIG_SPI_NOR_SFDP_MINIMAL=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

# CRC
CONFIG_CRC=y

# UDP firmware upgrade library (self-contained: owns config port 8600)
CONFIG_UDP_FW_UPGRADE=y
CONFIG_UDP_FW_RX_STACK_SIZE=1536

# Settings persistent storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y         /* 网络管理子系统; NET_MGMT_EVENT depends on 它 (非 select, 必须显式开) */
CONFIG_NET_MGMT_EVENT=y   /* 网络事件回调 (NET_EVENT_IF_UP 等) */
CONFIG_NET_DHCPV4=y       /* DHCP 客户端 (静态/DHCP 模式切换) */
# 网络缓冲精简: n2e-gw 仅 2 个 UDP socket (config 8600 + data 9600), 载荷小
# (nRF24 帧 ≤60B; 固件升级单包 512B). Ethernet 默认值 (14/14/36/36) 面向高吞吐
# 多连接, 对本应用严重过量, 精简以节省约 9KB RAM.
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
# 固件升级 512B 包需 4 个 buf, 8 个够; DATA_SIZE 保持默认 128
CONFIG_NET_BUF_DATA_SIZE=128
# 2 socket + DHCP 占 1, 4 足够
CONFIG_NET_MAX_CONN=4
CONFIG_TEST_RANDOM_GENERATOR=y

# hwinfo: 读 STM32 96-bit UID 派生 W5500 唯一 MAC (HWINFO_STM32 默认随 SOC 自动启用)
CONFIG_HWINFO=y
# 启用 ethernet net_mgmt (运行时 SET_MAC_ADDRESS 覆盖设备树 MAC)
CONFIG_NET_L2_ETHERNET_MGMT=y
# 关闭 ethernet 接口自动 up: net_if_post_init 不会自动拉起接口, 使 main 在
# net_if_up 之前处于 admin down, SET_MAC_ADDRESS 才能成功 (否则返回 -EACCES).
# 之后由 main 的 net_init() 手动 net_if_up.
CONFIG_ETH_NET_IF_NO_AUTO_START=y
