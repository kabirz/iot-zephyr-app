# ==================== 基础 ====================
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MULTITHREADING=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# shell
CONFIG_SHELL=y

# ==================== CANopenNode v4 ====================
CONFIG_CANOPENNODE=y
CONFIG_CANOPEN_NODE_ID=10
CONFIG_CANOPENNODE_LOG_LEVEL_INF=y
# LSS 关闭 (v1 不做在线改节点号/波特率; 需 T1 的 CO_CONFIG_LSS=0 映射)
CONFIG_CANOPENNODE_LSS=n
CONFIG_CANOPENNODE_SDO_CLIENT=n
CONFIG_CANOPENNODE_GATEWAY_ASCII=n
# OD 持久化 (0x1010/0x1011, settings 后端; 仅通信参数条目)
CONFIG_CANOPENNODE_STORAGE=y
# CiA 303-3 红绿 LED
CONFIG_CANOPENNODE_LEDS=y
# SYNC 线程关闭: main 循环的 canopennode_process() 已驱动全部对象 (含 PDO),
# 模块 sync 线程同样调用完整 CO_process, 双开会双重驱动
CONFIG_CANOPENNODE_SYNC_THREAD=n
# SDO 块传输 + 900B 缓冲 (CiA 302 固件下载用, 需 T1 模块补丁; 900 为
# CO_SDOserver.c 块传输 #error 下限, 见 Global Constraints 修订记录)
CONFIG_CANOPENNODE_SDO_BLOCK=y
CONFIG_CANOPENNODE_SDO_BUFFER_SIZE=900

# ==================== CAN ====================
CONFIG_CAN=y
CONFIG_CAN_STM32_BXCAN=y
# CANopenNode 为 NMT/SYNC/RPDO/SDO/EMCY/TIME 等对象各申请一个硬件 RX 过滤器
# (本 OD 配置共 16 个), 而 bxCAN 驱动默认只开 14 个 std 过滤器。约束:
# std + 2*ext <= 28 且 ext=0 会触发 Zephyr 驱动的 -Wzero-length-bounds 告警,
# 故用 std=24 + ext=2 (占满 can1 的 14 个 filter bank, can2 未用)
CONFIG_CAN_STM32_BXCAN_MAX_STD_ID_FILTERS=24
CONFIG_CAN_STM32_BXCAN_MAX_EXT_ID_FILTERS=2

# ==================== 硬件驱动 (16DI/8DO/4AI, slot1 在外部 SPI NOR) ====================
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_STM32=y
CONFIG_SPI=y
CONFIG_SPI_STM32=y
CONFIG_SPI_NOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CLOCK_CONTROL=y
CONFIG_HWINFO=y

# ==================== 文件系统 (历史记录, 外部 W25Q128 littlefs 分区) ====================
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=4
CONFIG_FS_LITTLEFS_CACHE_SIZE=1024

# ==================== 参数持久化 (settings + FCB -> storage_partition) ====================
# modbus/ 命名空间映射 holding_reg; canopen 命名空间为 CANopenNode OD 条目
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# ==================== 网络 (静态 IP, 无 DHCP) ====================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=20
CONFIG_NET_MAX_CONTEXTS=20
CONFIG_ZVFS_POLL_MAX=20
# ===== 网络缓冲 =====
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_PKT_DTCM=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
# W5500 由设备树 wiznet,w5500 节点自动拉起, 无需显式 CONFIG_ETH_W5500

# 静态 IP: 禁 DHCP, 禁自动启动 (允许 net_if_up 前设 MAC)
CONFIG_NET_DHCPV4=n
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_API=y

# ==================== Modbus (RAW ADU TCP + RTU) ====================
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1

# TCP Keepalive 检测主站连接存活 (取代应用层心跳):
# 空闲 30s 后每 5s 发探测, 连续 3 次无响应则判定连接断开
CONFIG_NET_TCP_KEEPALIVE=y
CONFIG_NET_TCP_KEEPIDLE_DEFAULT=30
CONFIG_NET_TCP_KEEPINTVL_DEFAULT=5
CONFIG_NET_TCP_KEEPCNT_DEFAULT=3

# ==================== Web 服务 (HTTP 页面 + REST API + WebSocket) ====================
# 总开关: y 时编译 web 相关代码 (页面/API/WS/HTTP 升级), n 时完全不编。
# 固件升级仍可用 UDP/CANopen SDO 通道。
CONFIG_CANOPEN_IO_WEB=y

# ==================== 固件升级 ====================
# UDP 固件升级共享库 + 配置端口业务命令 (SYS_INIT 自启动)
CONFIG_UDP_FW_UPGRADE=y
CONFIG_UDP_FW_CONFIG_PORT=8600
CONFIG_UDP_FW_DATA_V2_CHUNK=1400
# RX 线程内会调 settings_save() (NVS/flash 驱动链), 1024 会栈溢出
CONFIG_UDP_FW_RX_STACK_SIZE=2048
CONFIG_UDP_FW_RX_PRIORITY=1
CONFIG_UDP_FW_UPGRADE_MAX_HANDLERS=4
CONFIG_UDP_FW_REPLY_BCAST_RESTRICT=y

# CANopen SDO 固件下载走 IMG_MANAGER (fw_download.c), 见下 MCUboot 段;
# CAN 总线本身由 CANopenNode 使用, 不启用 libs/can_fw_upgrade

CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y
CONFIG_CRC=y

# ==================== MCUboot ====================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# ==================== 时间同步 (RTC) ====================
CONFIG_RTC=y
CONFIG_RTC_STM32=y

# ==================== 看门狗 ====================
CONFIG_WATCHDOG=y

# ==================== 日志 ====================
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_TIMESTAMP_USE_REALTIME=y
CONFIG_POSIX_C_LANG_SUPPORT_R=y
CONFIG_LOG_OUTPUT_FORMAT_DATE_TIMESTAMP=y
CONFIG_LOG_OUTPUT_TIMEZONE_OFFSET=8

# ==================== 调试 ====================
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_TAB=y
CONFIG_NET_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_FLASH_MAP_SHELL=y
CONFIG_RTC_SHELL=y
CONFIG_SETTINGS_SHELL=y
CONFIG_FAULT_DUMP=2
