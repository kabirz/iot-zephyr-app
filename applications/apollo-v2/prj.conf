# ==================== 基础 ====================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_HWINFO=y

# ==================== 板载 IO ====================
# LED/按键(gpio-leds + gpio-keys, 板 DTS 已含低有效/偏置修复)
CONFIG_GPIO=y
CONFIG_INPUT=y
# ADC1 PA5 / DAC1 PA4 (P10 跳线)
CONFIG_ADC=y
CONFIG_DAC=y
# I2C2: PCF8574(蜂鸣器/网口复位) + 24C02
CONFIG_I2C=y
CONFIG_EEPROM=y
# RTC (LSE)
CONFIG_RTC=y

# ==================== Flash / 外部内存 ====================
# QSPI W25Q256 (仅探测, 不写; 分区/MCUboot 见计划 P1-P2)
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y
# FMC SDRAM W9825G6KH (memc 驱动负责控制器初始化)
CONFIG_MEMC=y

# ==================== TF 卡 FAT 文件系统 ====================
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# 长文件名 + 中文 (V1 修复 #4/#6, 重实现时必须保留)
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_CODEPAGE=936
CONFIG_FS_FATFS_REENTRANT=y
# 大容量 TF 卡出厂多为 exFAT (实测 16GB 卡挂载 -19 后补开)
CONFIG_FS_FATFS_EXFAT=y

# ==================== CAN (节点由变体 overlay 使能) ====================
CONFIG_CAN=y

# ==================== MCUboot + MCUmgr 升级链路 ====================
# 应用链入内部 slot0 (板 DTS code-partition), 由 MCUboot 引导
CONFIG_BOOTLOADER_MCUBOOT=y
# bootutil 库: img_mgmt/flash_img 需要 (提供 boot_write_img_confirmed 等链接符号)
CONFIG_FLASH_MAP=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
# 升级通道 1/3: MCUmgr SMP over UDP :1337 (计划 §四)
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
# 默认 1024 对 img 上传+flash 写调用链偏紧
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=2048
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_NET_SOCKETS=y

# ==================== LCD 状态屏 (TFTLCD 2.8" ILI9341, FMC 8080) ====================
# LVGL 9 -> display_ili9341 -> mipi_dbi_stm32_fmc -> FMC NE1 (板 DTS lcd_bank)
CONFIG_DISPLAY=y
CONFIG_ILI9341=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_DOUBLE_VDB=y
# 电阻触摸 XPT2046 (bitbang SPI, zephyr,touch chosen 自动接入 LVGL 指针)
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y
CONFIG_INPUT_XPT2046=y

# ==================== 以太网 (YT8512C RMII) ====================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_DEFAULT_IF_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ENTROPY_GENERATOR=y
# 自写 PHY 驱动 (apps/drivers/yt8512)
CONFIG_PHY_MOTORCOMM_YT8512=y
# eth-bwtest 实测: TX 异步模式带负载会卡死, RX 线程栈 2048
CONFIG_ETH_STM32_HAL_RX_THREAD_STACK_SIZE=2048
# 网络缓冲: 整帧 1536B (128B 分片会拖死 TCP), 中等规模池
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
