# MCUboot 域附加配置 (经 sysbuild 的 mcuboot_EXTRA_CONF_FILE 引入)

# slot1/scratch 在 QSPI W25Q256 上: mcuboot 需要编入 QSPI 驱动
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y

# QSPI 传输完成靠信号量阻塞等待, mcuboot 需要多线程
CONFIG_MULTITHREADING=y

# 内部 slot0 = 7 x 256KB 扇区; QSPI slot1 = 1792KB / 4KB = 448 扇区
CONFIG_BOOT_MAX_IMG_SECTORS=512
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n

# 启动横幅/日志走 USART1 (板 chosen)
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
