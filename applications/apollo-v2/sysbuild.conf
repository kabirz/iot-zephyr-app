SB_CONFIG_BOOTLOADER_MCUBOOT=y

# MCUboot 升级模式: SWAP_SCRATCH (支持试运行/回滚, 与 io-edge-hub 一致;
# V1 实测跨 Flash: slot0 内部 + slot1/scratch QSPI)
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y

# 签名密钥 (每个应用独立 RSA-2048)
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/boards/${BOARD}.pem"
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
